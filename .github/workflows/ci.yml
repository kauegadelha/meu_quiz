
name: CI - Meu Quiz

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main

jobs:
  teste:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Executar testes
        run: mvn clean verify

      - name: Salvar relatório JaCoCo
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-jacoco
          path: target/site/jacoco/jacoco.xml
          if-no-files-found: error

  sast:
    needs: teste
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Baixar relatório JaCoCo
        uses: actions/download-artifact@v4
        with:
          name: relatorio-jacoco
          path: target/site/jacoco

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Autenticar no SonarQube Cloud
        uses: SonarSource/sonarqube-auth-action@b372e2c2930aadfcc4f4399446da1e12772709ad # v1.2
        id: auth

      - name: Executar análise SAST
        run: >
          mvn -B
          org.sonarsource.scanner.maven:sonar-maven-plugin:sonar
          -Dsonar.organization=${{ steps.auth.outputs.organization }}
          -Dsonar.projectKey=${{ steps.auth.outputs.project-key }}
          -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml
          -Dsonar.qualitygate.wait=true
  dast:
    needs: teste
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Gerar aplicação
        run: mvn clean package -DskipTests

      - name: Iniciar API
        run: |
          java -jar target/meu-quiz-1.0-SNAPSHOT.jar > app.log 2>&1 &
          echo $! > app.pid

      - name: Verificar disponibilidade da API
        run: |
          for i in {1..30}; do
            if curl -fsS http://localhost:8080/api/quiz/status; then
              echo "API iniciada com sucesso!"
              exit 0
            fi
            sleep 2
          done
          echo "A API não iniciou corretamente."
          cat app.log
          exit 1

      - name: Executar DAST com OWASP ZAP
        uses: zaproxy/action-api-scan@77dfa9a647bb0f583e39d4df8531634d6ddd8df4 # v0.9.0
        with:
          target: openapi.yaml
          format: openapi
          fail_action: false
          allow_issue_writing: false

